<svg xmlns="http://www.w3.org/2000/svg" width="448" height="132" viewBox="0 0 448 132" role="img" aria-labelledby="title desc">
  <title id="title">Ping A Human toast preview</title>
  <desc id="desc">A Codex-inspired macOS toast with an ocean blue and white gradient, white app tile, and black text.</desc>
  <defs>
    <!-- Mirrors the native AppKit ocean gradient in Sources/PingHumanToast/main.swift. -->
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="0.32">
      <stop offset="0%" stop-color="#4F5EFF"/>
      <stop offset="34%" stop-color="#8CB8FF"/>
      <stop offset="68%" stop-color="#F0FAFF"/>
      <stop offset="100%" stop-color="#478AF5"/>
    </linearGradient>
    <linearGradient id="bottom-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050814" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="app-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94C2FF"/>
      <stop offset="100%" stop-color="#3B5EF5"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-18%" width="116%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02040A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="2" y="2" width="444" height="128" rx="14" fill="url(#ocean)"/>
    <rect x="2" y="2" width="444" height="128" rx="14" fill="url(#bottom-wash)"/>
    <rect x="2.5" y="2.5" width="443" height="127" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.68"/>

    <g transform="translate(30 41)">
      <rect width="50" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.88"/>
      <path
        d="M20 37 C26 41 46 39 47 30 C50 22 48 8 42 7 C35 3 14 0 14 10 C5 14 3 34 20 37 Z"
        fill="url(#app-mark)"
      />
      <path d="M16 30 L20 34 L16 38" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 38 H34" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <text x="96" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#000000">
      Ping A Human
    </text>
    <text x="96" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.4" fill="#0A0A0A" opacity="0.82">
      AGENT IS WAITING
    </text>
    <text x="96" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#000000">
      Review database cutover?
    </text>
  </g>
</svg>
